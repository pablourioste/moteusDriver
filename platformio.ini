; PlatformIO project configuration -- Teensy 4.1 firmware.
;
; This sits alongside CMakeLists.txt, which still builds the Linux host
; binaries from the SAME sources.  Two build systems, one set of files:
;
;   cmake --build build           host binaries (x86 Linux)
;   pio run -e teensy41           Teensy firmware (ARM Cortex-M7)
;
; On WSL2, BUILD here but FLASH and MONITOR from Windows -- Teensy upload
; reboots the board into its HalfKay bootloader, which enumerates as a
; different USB device (16C0:0478 vs 16C0:0483), so a usbipd attachment
; drops on every upload.  See docs/2D_model/IMU_SETUP.md step 0.1.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

monitor_speed = 115200

build_flags =
    -I include
    -Wall
    -Wextra

; Only firmware/ for now.  src/core/ and src/embedded/ get added at
; INTEGRATION.md step S1, once the shared core build is set up.  core/
; is referenced IN PLACE, never copied -- a copy would let the host and
; Teensy control laws drift apart.
build_src_filter =
    +<../firmware/>
