; PlatformIO project configuration -- Teensy 4.1 firmware.
;
; Sits alongside CMakeLists.txt, which still builds the Linux host
; binaries from the SAME sources.  Two build systems, one set of files:
;
;   cmake --build build              host binaries (x86 Linux)
;   pio run -e <environment>         Teensy firmware (ARM Cortex-M7)
;
; On WSL2, BUILD here but FLASH and MONITOR from Windows -- Teensy upload
; reboots the board into its HalfKay bootloader, which enumerates as a
; different USB device (16C0:0478 vs 16C0:0483), so a usbipd attachment
; drops on every upload.  See docs/INSTALL.md Part B4.
;
; ---------------------------------------------------------------------
; ONE ENVIRONMENT PER TEST
;
; Each firmware/<name>/ folder is a standalone sketch with its own
; setup() and loop().  They cannot be compiled together -- two setup()
; symbols in one binary is a link error -- so each gets an environment
; selecting only its own folder via build_src_filter.
;
;   pio run -e board_check -t upload     which test to build+flash
;   pio run                              builds ALL of them (CI check)
;
; To add a hardware test: create firmware/<name>/main.cpp and copy an
; environment block below.
; ---------------------------------------------------------------------

; `default_envs` only takes effect in [platformio].  Placed in [env] it is
; silently ignored ("Ignore unknown configuration option") and a bare
; `pio run` builds every environment instead of just this one.
[platformio]
default_envs = board_check

[env]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200

build_flags =
    -I include
    -I third_party
    -Wall
    -Wextra


; --- Step 0.4 / 0.5 -- is the Teensy alive? -------------------------
; Blinks asymmetrically and prints F_CPU and sizeof(double).
; No external hardware.
[env:board_check]
build_src_filter = +<../firmware/board_check/>


; --- Step 0.6 -- does the SPI peripheral work? ----------------------
; Needs ONE jumper: pin 11 -> pin 12.  No sensor.
[env:spi_loopback]
build_src_filter = +<../firmware/spi_loopback/>


; --- Step 2 -- does the BMI270 answer? ------------------------------
; Reads CHIP_ID, expects 0x24.  Needs the IMU wired per IMU_SETUP.md
; step 1.
[env:imu_spi_test]
build_src_filter = +<../firmware/imu_spi_test/>


; --- Step 3 -- upload the 8 KB config blob --------------------------
; Enables the accel/gyro, which ship DISABLED.  Same wiring as step 2.
; Must run after imu_spi_test passes.
[env:imu_config_upload]
build_src_filter = +<../firmware/imu_config_upload/>


; --- Step 4 -- read real accel/gyro data ----------------------------
; Uploads the blob itself (it does not survive a reset), then streams
; converted values at 10 Hz.  Same wiring as step 2.
[env:imu_read]
build_src_filter = +<../firmware/imu_read/>


; --- Steps 4b/5/6 -- calibration ------------------------------------
; Interactive menu: axis mapping, gyro bias, six-position accel fit.
; Prints paste-ready build flags.  Same wiring as step 2.
[env:imu_calibrate]
build_src_filter = +<../firmware/imu_calibrate/>


