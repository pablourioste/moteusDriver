; PlatformIO project configuration -- Teensy 4.1 firmware.
;
; Sits alongside CMakeLists.txt, which still builds the Linux host
; binaries from the SAME sources.  Two build systems, one set of files:
;
;   cmake --build build              host binaries (x86 Linux)
;   pio run -e <environment>         Teensy firmware (ARM Cortex-M7)
;
; On WSL2, BUILD here but FLASH and MONITOR from Windows -- Teensy upload
; reboots the board into its HalfKay bootloader, which enumerates as a
; different USB device (16C0:0478 vs 16C0:0483), so a usbipd attachment
; drops on every upload.  See docs/INSTALL.md Part B4.
;
; ---------------------------------------------------------------------
; ONE ENVIRONMENT PER TEST, GROUPED BY WHAT IT EXERCISES
;
; Each firmware/<part>/<name>/ folder is a standalone sketch with its own
; setup() and loop().  They cannot be compiled together -- two setup()
; symbols in one binary is a link error -- so each gets an environment
; selecting only its own folder via build_src_filter.
;
; <part> is the piece of the rig under test, so "what do I flash to check
; the IMU?" is answered by listing a directory:
;
;   teensy/      the MCU itself -- no external hardware, or one jumper
;   imu/         the BMI270 and its driver
;   drivers/     the moteus controller and the CAN link to it
;   full_case/   the assembled cube -- several parts at once
;
; Environment names are FLAT and unchanged by that grouping: the folder
; moved, `pio run -e imu_read` did not.  Every -e in the docs still works.
;
;   pio run -e board_check -t upload     which test to build+flash
;   pio run                              builds ONLY default_envs below,
;                                        NOT every environment
;   pio run -e board_check -e ... -e telemetry_test
;                                        every env, the bit-rot check
;
; To add a hardware test: create firmware/<part>/<name>/main.cpp and copy
; an environment block below into that part's section.
; ---------------------------------------------------------------------

; `default_envs` only takes effect in [platformio].  Placed in [env] it is
; silently ignored ("Ignore unknown configuration option") and a bare
; `pio run` builds every environment instead of just this one.
[platformio]
default_envs = board_check

[env]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200

; IMU calibration -- measured, not defaults.  Source of truth is
; data/imu_calibration/imu-cal-20260805T125013.log (bench, 23.5 C);
; the README there explains why the offsets are as large as they are.
;
; These MUST stay in step with the IMU_* cache variables in
; CMakeLists.txt.  Same sensor, two build systems: a divergence means
; the host build and the rig disagree about which way gravity points.
;
; Applied as  a_corrected = (a_raw - offset) / scale
;             w_corrected = w_raw - bias
;
; Re-measure the gyro bias if the rig runs much warmer than 23.5 C --
; gyro bias moves with temperature.
;
; EACH VALUE IS DEFINED TWICE, under two macro names, because the two
; drivers spell them differently:
;
;   Bmi270SpiDriver (embedded, Teensy)  reads  GYRO_BIAS_X
;   ImuDriver       (host, Linux I2C)   reads  DEFAULT_IMU_GYRO_BIAS_X
;
; Both are #ifdef-guarded and fall back to the identity transform, so a
; missing name does not fail the build -- it silently produces an
; UNCALIBRATED binary that looks exactly like a calibrated one.  That
; is precisely the failure imu_driver_test caught on 2026-08-05 when
; only the DEFAULT_IMU_ set was defined here.
;
; Keep the pairs in step, and in step with CMakeLists.txt's IMU_* cache
; variables.  Three places, one sensor.
build_flags =
    -I include
    -I third_party
    -Wall
    -Wextra
    -D GYRO_BIAS_X=0.002348
    -D GYRO_BIAS_Y=-0.001140
    -D GYRO_BIAS_Z=-0.000762
    -D ACCEL_OFFSET_X=-0.092282
    -D ACCEL_OFFSET_Y=-0.196510
    -D ACCEL_OFFSET_Z=0.050664
    -D ACCEL_SCALE_X=0.991085
    -D ACCEL_SCALE_Y=0.991035
    -D ACCEL_SCALE_Z=1.003787
    -D DEFAULT_IMU_GYRO_BIAS_X=0.002348
    -D DEFAULT_IMU_GYRO_BIAS_Y=-0.001140
    -D DEFAULT_IMU_GYRO_BIAS_Z=-0.000762
    -D DEFAULT_IMU_ACCEL_OFFSET_X=-0.092282
    -D DEFAULT_IMU_ACCEL_OFFSET_Y=-0.196510
    -D DEFAULT_IMU_ACCEL_OFFSET_Z=0.050664
    -D DEFAULT_IMU_ACCEL_SCALE_X=0.991085
    -D DEFAULT_IMU_ACCEL_SCALE_Y=0.991035
    -D DEFAULT_IMU_ACCEL_SCALE_Z=1.003787


; =====================================================================
; firmware/teensy/ -- the MCU on its own
; =====================================================================

; --- Step 0.4 / 0.5 -- is the Teensy alive? -------------------------
; Blinks asymmetrically and prints F_CPU and sizeof(double).
; No external hardware.
[env:board_check]
build_src_filter = +<../firmware/teensy/board_check/>


; --- Step 0.6 -- does the SPI peripheral work? ----------------------
; Needs ONE jumper: pin 11 -> pin 12.  No sensor.
[env:spi_loopback]
build_src_filter = +<../firmware/teensy/spi_loopback/>


; --- INTEGRATION.md S1 -- does core/ compile on BOTH toolchains? ----
; The first step of the Teensy port, and the only env so far that
; compiles anything from src/.  No hardware wired.
;
; `build_src_filter` paths are relative to src_dir (= src/), so `core/`
; means src/core/ -- but anything OUTSIDE src/ needs the ../ prefix.
; That asymmetry is why the firmware entries look inconsistent.
;
; An explicit filter REPLACES the default +<*> rather than adding to it,
; which is what keeps the other sketch envs from accidentally pulling in
; src/ now that something lives there.
;
; core/ is REFERENCED IN PLACE, never copied into firmware/.  A copy is
; how the host control law and the Teensy control law silently diverge.
[env:core_check]
build_src_filter =
    +<core/>
    +<../firmware/teensy/core_check/>


; =====================================================================
; firmware/imu/ -- the BMI270, wired per IMU_SETUP.md step 1
; =====================================================================

; --- Step 2 -- does the BMI270 answer? ------------------------------
; Reads CHIP_ID, expects 0x24.  Needs the IMU wired per IMU_SETUP.md
; step 1.
[env:imu_spi_test]
build_src_filter = +<../firmware/imu/imu_spi_test/>


; --- Step 3 -- upload the 8 KB config blob --------------------------
; Enables the accel/gyro, which ship DISABLED.  Same wiring as step 2.
; Must run after imu_spi_test passes.
[env:imu_config_upload]
build_src_filter = +<../firmware/imu/imu_config_upload/>


; --- Step 4 -- read real accel/gyro data ----------------------------
; Uploads the blob itself (it does not survive a reset), then streams
; converted values at 10 Hz.  Same wiring as step 2.
[env:imu_read]
build_src_filter = +<../firmware/imu/imu_read/>


; --- Steps 4b/5/6 -- calibration ------------------------------------
; Interactive menu: axis mapping, gyro bias, six-position accel fit.
; Prints paste-ready build flags.  Same wiring as step 2.
[env:imu_calibrate]
build_src_filter = +<../firmware/imu/imu_calibrate/>


; --- INTEGRATION.md S2 -- Bmi270SpiDriver cross-validation ----------
; The IImuSensor implementation the control loop will use, gathered from
; the imu_read / imu_calibrate sketches into a class.  This env exists to
; prove the gathered version still agrees with the originals: same bench,
; same pose, same numbers.  Same wiring as imu_spi_test.
;
; PASTE YOUR CALIBRATION HERE.  Run -e imu_calibrate, work through menu
; [g] and [1]..[6] then [f], and copy its [s] output below.  Without it
; the driver runs the identity transform -- an uncalibrated sensor that
; looks exactly like a calibrated one.
;
; The calibration flags live in the shared [env] build_flags above, so
; this environment needs no build_flags of its own.  Do NOT add one
; here without `${env.build_flags}` as its first line: a per-env
; build_flags REPLACES the shared list rather than extending it, which
; would drop the -I paths and the calibration in one go.
[env:imu_driver_test]
build_src_filter =
    +<embedded/Bmi270SpiDriver.cpp>
    +<../firmware/imu/imu_driver_test/>


; =====================================================================
; firmware/drivers/ -- the moteus controller and the CAN link to it
; =====================================================================

; --- INTEGRATION.md S3 -- CAN-FD listen-only ------------------------
; The Teensy listens while the HOST talks to the moteus over fdcanusb.
; Cannot transmit, by construction.
;
; ** Read the H3 meter checks in the sketch header BEFORE flashing. **
; A 5 V transceiver destroys CAN3 RX permanently.
;
; Wiring: pins 30 (TX) / 31 (RX) -- CAN3 is the ONLY FD-capable module
; on this silicon, and moteus requires FD.
[env:can_listen]
build_src_filter = +<../firmware/drivers/can_listen/>
lib_deps = https://github.com/tonton81/FlexCAN_T4.git


; =====================================================================
; firmware/full_case/ -- several parts of the rig at once
; =====================================================================

; --- Binary telemetry -- step 3 of the telemetry build order --------
; Streams 118-byte binary TelemetryFrame records over USB CDC instead of
; printf'd text.  Same wiring as step 2.
;
; Lives under full_case/ rather than imu/ because it is not an IMU test:
; it exercises the IMU, core/TelemetryFrame and the host-side capture as
; one path, and a failure can be in any of the three.
;
; EMITS BINARY: do not open a serial monitor on it, use
;   python.exe tools/telemetry/capture.py --port COM9 --out logs/t.bin
;
; Needs `include/` on the path for core/TelemetryFrame.hpp -- the wire
; format is shared with the host build, and the static_assert on sizeof is
; what proves both toolchains agree about the layout.  `-I include` is
; already in the shared [env] build_flags above.
[env:telemetry_test]
build_src_filter =
    +<core/TelemetryFrame.cpp>
    +<../firmware/full_case/telemetry_test/>


; --- SAME SKETCH, TELEMETRY OUT OVER THE UART TO THE XIAO -----------
; Identical source to [env:telemetry_test] plus TELEMETRY_SINK_UART1,
; which swaps the ITelemetrySink implementation from USB CDC to Serial1.
; Nothing else differs -- same frames, same ring, same drain policy.
; That one-line swap is what include/core/TelemetrySink.hpp exists for.
;
; THE DEFAULT [env:telemetry_test] IS UNAFFECTED.  The alternate sink is
; #ifdef'd out of it entirely, so the COM-port capture path keeps
; behaving exactly as it did.  Use that env, not this one, whenever you
; want the USB stream back.
;
; Wiring, on top of the BMI270 (which is unchanged):
;   Teensy GND    -- Xiao GND        (NOT optional: shared return)
;   Teensy pin 1  -- Xiao D7  (TX1 -> Xiao RX)
;   Teensy pin 0  -- Xiao D6  (RX1 <- Xiao TX)
;
; Serial1 runs at 921600.  118 bytes x 400 Hz x 10 bits = 472 kbaud
; minimum, so 115200 is not slow-but-workable, it is a quarter of what
; is needed.  Keep it in step with UART_BAUD in xiao_bridge.
;
; Flash [env:xiao_bridge] on the Xiao first, then this, then:
;   ./moteus-venv/bin/python tools/telemetry/wifi_link_test.py -s 60
[env:telemetry_test_uart]
build_src_filter =
    +<core/TelemetryFrame.cpp>
    +<../firmware/full_case/telemetry_test/>
build_flags =
    ${env.build_flags}
    -D TELEMETRY_SINK_UART1


; --- INTEGRATION.md S4 -- TeensyMoteusDriver, query path only -------
; The Teensy TRANSMITS here, unlike can_listen.  Requires S3 to have
; passed with zero error counters.
;
; ** WHEEL OFF THE SHAFT (H4), moteus on LOGIC POWER ONLY. **
;
; sendTorque() is disarmed in the driver and never armed by this sketch,
; so the motor cannot be commanded no matter what the menu does.
;
; Needs the vendor headers on the path: moteus_protocol.h compiles
; unmodified for Cortex-M7, so the register encoding is reused rather
; than reimplemented.  `${env.build_flags}` FIRST -- a per-env
; build_flags replaces the shared list rather than extending it, which
; would drop -I include and the IMU calibration together.
[env:moteus_driver_test]
build_src_filter =
    +<embedded/TeensyMoteusDriver.cpp>
    +<../firmware/drivers/moteus_driver_test/>
lib_deps = https://github.com/tonton81/FlexCAN_T4.git
build_flags =
    ${env.build_flags}
    -I moteus/lib/cpp/mjbots/moteus
    ; S5 expected config -- MIRROR OF THE CMakeLists.txt CACHE VARIABLES.
    ; The host pushes those values to the board; the Teensy reads them
    ; back and refuses to arm on a mismatch.  Keep the two in step: if
    ; you change SERVO_MAX_CURRENT_A in CMakeLists.txt, change it here
    ; too, or [c] will report a mismatch on a correctly configured board.
    ;
    ; A silently-wrong servo.max_current_A is rig-destroying, which is
    ; why it is checked at all -- and why the expectation lives in the
    ; binary rather than being read from the same board it validates.
    -D EXPECT_SERVO_MAX_CURRENT_A=15.0
    -D EXPECT_ROTOR_TO_OUTPUT_RATIO=1.0
    -D EXPECT_SERVO_MAX_VELOCITY=100.0


; --- INTEGRATION.md N1 -- THE ONLY FIRMWARE THAT MOVES THE MOTOR ----
;
;   ####################################################################
;   ##  REMOVE THE REACTION WHEEL FROM THE SHAFT BEFORE FLASHING.     ##
;   ####################################################################
;
; Same source file as moteus_driver_test, plus -D ENABLE_TORQUE_TEST.
; That flag is what compiles the torque menu items IN -- without it the
; instructions that command torque are not in the binary at all, so the
; default build cannot move the motor no matter what it is sent.
;
; The separation is deliberate: arming the motor should require flashing
; different firmware, with the checklist in front of you, rather than
; pressing a key on a build you already had loaded.
;
; A sign error here drives the cube into its fall at full authority
; instead of catching it.  With the wheel off there is no stored energy
; to do it with, which is why H4 comes before N1 and not after.
;
; What this env exists to prove:
;   [+] / [-]  torque pushes the shaft the expected way, both signs
;   [w]        the watchdog stops the motor when the host disappears
;              -- unplug the Teensy mid-command; shaft stops in ~150 ms.
;              If it keeps turning, watchdog_timeout was left kIgnore
;              and nothing after this step is safe.
[env:moteus_driver_test_torque]
build_src_filter =
    +<embedded/TeensyMoteusDriver.cpp>
    +<../firmware/drivers/moteus_driver_test/>
lib_deps = https://github.com/tonton81/FlexCAN_T4.git
build_flags =
    ${env.build_flags}
    -I moteus/lib/cpp/mjbots/moteus
    -D EXPECT_SERVO_MAX_CURRENT_A=15.0
    -D EXPECT_ROTOR_TO_OUTPUT_RATIO=1.0
    -D EXPECT_SERVO_MAX_VELOCITY=100.0
    -D ENABLE_TORQUE_TEST


; --- INTEGRATION.md S6 -- the control loop, torque DISARMED ---------
;
; The real thing: BMI270 -> StateEstimator -> BalancingController ->
; moteus, at 200 Hz, with binary telemetry.  Commands NOTHING -- the
; sendTorque() call is not compiled in without the flag below.
;
; Compiles src/core/ IN PLACE, the same sources the host CMake build
; compiles.  That sharing is the point: a copy would let the simulation
; and the rig drift apart silently.
;
; EMITS BINARY on USB CDC: capture with tools/telemetry/capture.py, do
; not open a plain serial monitor on it.
;
; ** It will REFUSE TO RUN until the gains below are measured. **  That
; refusal IS the expected S6 result, and it proves the NaN gate survived
; the port.  Fill them in from docs/3d_scaling/README.md s3 and s4.
[env:cube_balancer]
build_src_filter =
    +<core/>
    +<embedded/>
    +<../firmware/full_case/cube_balancer/>
lib_deps = https://github.com/tonton81/FlexCAN_T4.git
build_flags =
    ${env.build_flags}
    -I moteus/lib/cpp/mjbots/moteus
    ; --- IMU calibration: paste from imu_calibrate menu [s] ----------
    ;-D GYRO_BIAS_X=0.0
    ;-D GYRO_BIAS_Y=0.0
    ;-D GYRO_BIAS_Z=0.0
    ;-D ACCEL_OFFSET_X=0.0
    ;-D ACCEL_OFFSET_Y=0.0
    ;-D ACCEL_OFFSET_Z=0.0
    ;-D ACCEL_SCALE_X=1.0
    ;-D ACCEL_SCALE_Y=1.0
    ;-D ACCEL_SCALE_Z=1.0
    ; --- estimator: filter + axis mapping ---------------------------
    ; gyro_axis / accel_axis_a / accel_axis_b come from imu_calibrate
    ; menu [m].  invert_theta has NO unset sentinel -- it is a bool, so
    ; firstUnsetField() cannot catch a wrong choice.  Verify it by hand:
    ; tilting one way must give theta of one consistent sign.
    ;-D EST_TAU=0.5
    ;-D EST_GYRO_AXIS=0
    ;-D EST_ACCEL_AXIS_A=1
    ;-D EST_ACCEL_AXIS_B=2
    ;-D EST_INVERT_THETA=false
    ;-D EST_THETA_OFFSET=0.0
    ;-D EST_RATE_CUTOFF_HZ=15.0
    ;-D EST_WARMUP_SAMPLES=200
    ;-D EST_ACCEL_GATE=0.25
    ; --- controller: LQR gains + safety envelope --------------------
    ; max_torque_nm cannot exceed what servo.max_current_A delivers:
    ; at K_t = 0.0256 Nm/A, 15 A is ~0.38 Nm.  Above that the law just
    ; saturates without ever reaching its nominal limit.
    ;-D CTL_K_THETA=0.0
    ;-D CTL_K_THETA_DOT=0.0
    ;-D CTL_K_OMEGA=0.0
    ;-D CTL_MAX_TILT_RAD=0.2618
    ;-D CTL_MAX_TORQUE_NM=0.2
    ;-D CTL_MAX_WHEEL_OMEGA=300.0
    ;-D CTL_THETA_DEADBAND=0.002


; --- INTEGRATION.md N1/N2 -- THE BALANCER, TORQUE ARMED -------------
;
;   ####################################################################
;   ##  N1: WHEEL OFF.  Tilt by hand, check the shaft pushes the      ##
;   ##      RIGHT WAY.  Only then does the wheel go back on (N2).     ##
;   ####################################################################
;
; Identical source to [env:cube_balancer] plus ENABLE_BALANCER_TORQUE,
; which is what compiles the sendTorque() call in.  Without it that
; instruction is absent from the image.
;
; If the cube drives its own fall, DO NOT flip the sign in the control
; law: the bug is upstream, in EST_INVERT_THETA or SOURCE0_SIGN, and
; negating the law to compensate hides it somewhere worse.
;
; N2: start at ~30% of the computed gains with CTL_MAX_TORQUE_NM clamped
; low, and walk both up together across runs.  Tune k_omega LAST.
[env:cube_balancer_torque]
build_src_filter =
    +<core/>
    +<embedded/>
    +<../firmware/full_case/cube_balancer/>
lib_deps = https://github.com/tonton81/FlexCAN_T4.git
build_flags =
    ${env.build_flags}
    -I moteus/lib/cpp/mjbots/moteus
    -D ENABLE_BALANCER_TORQUE


; =====================================================================
; firmware/xiao/ -- the XIAO ESP32-C6 WiFi bridge
;
; A DIFFERENT MCU IN THE SAME PROJECT.  These environments override
; platform/board/framework from [env] above, which is set up for the
; Teensy.  PlatformIO scopes all of that per environment, so nothing
; here can affect a `pio run -e telemetry_test`: the Teensy build and
; the USB/COM capture path keep working exactly as before.
;
; They also override `build_flags` wholesale rather than extending it.
; That is intentional -- the shared list carries the BMI270 calibration
; macros, which belong to the sensor on the Teensy and would be
; meaningless (and misleading) baked into the radio's firmware.  The
; Xiao never touches the IMU.
;
; FLASHING IS EASIER THAN THE TEENSY, usually.  The Teensy reboots into
; its HalfKay bootloader on upload and enumerates as a different USB
; device, so the usbipd attachment drops every time.  The ESP32-C6
; flashes over native USB and keeps its identity, so `-t upload` from
; WSL normally just works.  If it does not, hold BOOT while plugging in,
; or fall back to the build-in-WSL / flash-from-Windows split.
;
; Bring-up order and the test for each step:
; docs/2D_model/XIAO_BRINGUP.md
; =====================================================================

; Shared Xiao settings.  `extends` copies these into each environment;
; it does NOT create a buildable environment of its own.
[xiao_base]
; The board definition for seeed_xiao_esp32c6 landed in the official
; espressif32 platform only recently.  The pioarduino fork is the one
; known to carry it together with a working ESP32-C6 Arduino core --
; pinned here rather than to `espressif32` so a fresh clone resolves the
; board instead of failing with "Unknown board ID".
platform = https://github.com/pioarduino/platform-espressif32.git#develop
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; DO NOT SET upload_port / monitor_port HERE.  Autodetect is already
; correct, and pinning the port makes it worse.  This was tried and
; reverted on 2026-08-05; the reasons are worth keeping.
;
; /dev/ttyACM* numbering is assignment ORDER, not identity -- whichever
; board attaches to WSL first takes ACM0, and it moves again when either
; is detached or when the C6 re-enumerates after a flash.  So a literal
; `upload_port = /dev/ttyACM1` is wrong roughly half the time.
;
; A by-id glob does not fix it either.  PlatformIO does not expand shell
; wildcards against the filesystem: platformio/device/finder.py treats a
; value containing * ? [ ] as a PATTERN and fnmatches it against
; item["port"] from list_serial_ports() -- i.e. against "/dev/ttyACM0".
; A /dev/serial/by-id/... pattern therefore matches nothing, and the
; unexpanded string is handed to esptool, which reports the confusing
; "port is busy or doesn't exist".
;
; With upload_port UNSET, find() falls through to _find_board_device(),
; which matches the board manifest's build.hwids.  seeed_xiao_esp32c6.json
; declares 0x2886:0x0046 and 0x303A:0x1001, so the Xiao is selected by
; VID:PID -- identity, immune to renumbering, and incapable of picking the
; Teensy (16C0:0483) even with both boards attached at once.
;
; If you ever DO need to force it, use the exact by-id path with NO
; wildcard (no * means no pattern matching, so it is passed through
; literally and pyserial opens the symlink):
;   /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_<MAC>-if00

build_flags =
    -I include
    -Wall
    -Wextra
    ; Route Serial to the native USB CDC peripheral.  Without this the
    ; ESP32-C6 core maps Serial to a hardware UART on pins nothing is
    ; connected to, and every sketch here appears to boot silently.
    -D ARDUINO_USB_CDC_ON_BOOT=1


; --- X0 -- is the Xiao alive? ---------------------------------------
; No wiring at all.  Separates "toolchain/flash broken" from "circuit
; broken" before anything is attached.  Prints chip, heap and reset
; reason, then ticks once a second.
[env:xiao_board_check]
extends = xiao_base
build_src_filter = +<../firmware/xiao/xiao_board_check/>


; --- X1 -- does the UART to the Teensy work? ------------------------
; Needs 3 wires: GND, Xiao D6 -> Teensy pin 0, Xiao D7 <- Teensy pin 1.
; Transmits XIAO_PING once a second AND hexdumps everything received,
; so one flash tests both directions.
;
; Runs at 921600 by default -- the rate the telemetry link actually
; needs.  Framing errors appear at high baud and not at low, so testing
; at 115200 proves very little.  To bisect a bad link:
;   pio run -e xiao_uart_echo -t upload --build-flag "-DUART_BAUD=115200"
[env:xiao_uart_echo]
extends = xiao_base
build_src_filter = +<../firmware/xiao/xiao_uart_echo/>


; --- X2 -- does the radio work on its own? --------------------------
; No UART, no Teensy.  SoftAP + a UDP echo server, so the wireless link
; can be proven healthy before it is blamed for anything.
[env:xiao_softap]
extends = xiao_base
build_src_filter = +<../firmware/xiao/xiao_softap/>


; --- X3 -- does WiFi carry REAL telemetry frames? -------------------
; The Xiao generates synthetic cube::TelemetryFrame records itself and
; sends them over UDP.  No Teensy, no UART, no IMU: anything the host
; fails to decode was mangled by the radio and nothing else.
;
; This is also where the packed frame layout gets proven on a THIRD
; toolchain.  src/core/TelemetryFrame.cpp is REFERENCED IN PLACE, never
; copied -- the static_assert on sizeof() now has to hold for Cortex-M7,
; RISC-V and x86-64 simultaneously, which is the only real evidence the
; layout is portable rather than a compiler coincidence.
;
; Rate is overridable for bandwidth experiments:
;   pio run -e xiao_frame_source -t upload --build-flag "-DFRAME_RATE_HZ=400"
[env:xiao_frame_source]
extends = xiao_base
build_src_filter =
    +<core/TelemetryFrame.cpp>
    +<../firmware/xiao/xiao_frame_source/>


; --- X4 -- the bridge ------------------------------------------------
; The real thing: UART <-> UDP in both directions, batched outbound,
; unbatched inbound, with per-hop byte counters on the USB port.
;
; The UART runs at 921600, NOT 115200.  118 bytes x 200 Hz x 10 bits =
; 236 kbaud minimum; 115200 carries 97 frames/s and corrupts under load
; rather than failing cleanly.  Keep the Teensy's Serial1.begin() in
; step with UART_BAUD here.
;
; The link-loss watchdog is deliberately NOT in this firmware -- a
; fail-safe on the radio module cannot fire when the radio module is
; what failed.  It belongs on the Teensy.
[env:xiao_bridge]
extends = xiao_base
build_src_filter = +<../firmware/xiao/xiao_bridge/>
